<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MedSkills Catalyst — Brochure</title>
<meta name="description" content="Download the MedSkills Catalyst brochure — India's MedTech career accelerator for life-science graduates and healthcare professionals.">
<link rel="icon" href="brand/logo/MedSkills-Catalyst_Logo.png" type="image/png">
<link rel="canonical" href="https://www.medskillscatalyst.com/brochure">
<meta property="og:type" content="website">
<meta property="og:site_name" content="MedSkills Catalyst">
<meta property="og:title" content="MedSkills Catalyst — Programme Brochure">
<meta property="og:description" content="See the full MedSkills Catalyst programme — curriculum, mentors, and career outcomes. The brochure downloads automatically.">
<meta property="og:url" content="https://www.medskillscatalyst.com/brochure">
<meta property="og:image" content="https://www.medskillscatalyst.com/assets/hero_training.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="MedSkills Catalyst — Programme Brochure">
<meta name="twitter:description" content="See the full MedSkills Catalyst programme — curriculum, mentors, and career outcomes.">
<meta name="twitter:image" content="https://www.medskillscatalyst.com/assets/hero_training.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0A2A43; --blue:#00589E; --cyan:#4AD0FF; --canvas:#F7F9FB;
  --easy-out:cubic-bezier(.16,1,.3,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--navy);display:flex;flex-direction:column}
.bar{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.8rem clamp(1rem,3vw,2rem);background:rgba(10,42,67,.92);border-bottom:1px solid rgba(255,255,255,.1);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.brand{display:flex;align-items:center;gap:.7rem;color:#fff;text-decoration:none;min-width:0}
.brand img{height:36px;width:36px;object-fit:contain;flex-shrink:0}
.brand-name{font-weight:800;font-size:.95rem;letter-spacing:-.01em;white-space:nowrap}
.brand-sub{display:block;font-size:.62rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.55)}
.bar-note{font-size:.78rem;color:rgba(255,255,255,.6);text-align:center;flex:1;min-width:0}
.bar-note strong{color:var(--cyan);font-weight:700}
.dl-btn{display:inline-flex;align-items:center;gap:.55rem;padding:.65rem 1.3rem;border-radius:100px;background:#fff;color:var(--navy);font-weight:700;font-size:.85rem;text-decoration:none;white-space:nowrap;transition:transform .3s var(--easy-out),box-shadow .3s var(--easy-out);box-shadow:0 4px 16px rgba(4,16,26,.35)}
.dl-btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(4,16,26,.45)}
.dl-btn svg{width:15px;height:15px;stroke:currentColor;stroke-width:2.2;fill:none}
.viewer{flex:1;min-height:0}
.viewer iframe{width:100%;height:100%;border:0;display:block;background:#3c4650}
.fallback{display:none;flex:1;align-items:center;justify-content:center;padding:2rem;text-align:center;color:rgba(255,255,255,.75);font-size:.95rem;line-height:1.6}
@media(max-width:640px){.bar-note{display:none}.brand-name{font-size:.85rem}}
</style>
</head>
<body>
<header class="bar">
  <a class="brand" href="/">
    <img src="brand/logo/MedSkills-Catalyst_Logo.png" alt="MedSkills Catalyst logo">
    <span class="brand-name">MedSkills Catalyst<span class="brand-sub">Upskill to Upscale</span></span>
  </a>
  <p class="bar-note">Your download starts automatically. <strong>Not started?</strong> Use the button.</p>
  <a class="dl-btn" id="dl" href="/MedSkills-Catalyst-Brochure.pdf" download="MedSkills-Catalyst-Brochure.pdf">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M4 19h16" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Download Brochure
  </a>
</header>
<main class="viewer" id="viewer">
  <iframe src="/MedSkills-Catalyst-Brochure.pdf#view=FitH" title="MedSkills Catalyst Brochure"></iframe>
</main>
<div class="fallback" id="fallback">
  <p>Your device doesn't preview PDFs in the browser.<br>The brochure has been downloaded to your device — check your Downloads folder.</p>
</div>
<script>
// Auto-start the download shortly after load (same-origin `download` attribute).
setTimeout(function(){ document.getElementById('dl').click(); }, 900);
// iOS Safari can't render multi-page PDFs inline; show a friendly note instead of a broken frame.
var ua = navigator.userAgent;
if (/iPhone|iPad|iPod/.test(ua) && /Safari/.test(ua) && !/CriOS|FxiOS/.test(ua)) {
  document.getElementById('viewer').style.display = 'none';
  var fb = document.getElementById('fallback'); fb.style.display = 'flex';
}
</script>
</body>
</html>
